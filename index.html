<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12345c">
<meta name="description" content="Conecta Irmãos — plataforma de serviços da Igreja Presença de Deus. Profissionais da comunidade, contato direto pelo WhatsApp.">
<title>Conecta Irmãos — Igreja Presença de Deus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --verde:#12345c;--verde2:#1c4a7a;--verde3:#e8eef4;
  --dourado:#d9a520;--dourado2:#fbf1d9;
  --creme:#f5f7fa;--tinta:#16211d;--cinza:#6c7a74;--linha:#e4e0d4;
  --branco:#fff;--vermelho:#b3392f;--azul:#2a5d8f;
  --r:14px;--sombra:0 6px 22px rgba(22,33,29,.08);
  --fonte:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html,body{margin:0;padding:0}
body{font-family:var(--fonte);background:var(--creme);color:var(--tinta);font-size:15px;line-height:1.45;min-height:100vh}
img{max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--verde);text-decoration:none}
.app{max-width:820px;margin:0 auto;padding-bottom:88px;min-height:100vh}
.wrap{padding:16px}
.center{text-align:center}
.muted{color:var(--cinza);font-size:13px}
.small{font-size:12.5px}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.2;font-weight:700;letter-spacing:-.2px}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}
p{margin:0 0 10px}
hr{border:0;border-top:1px solid var(--linha);margin:16px 0}

/* Marca */
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--verde),#0a2540);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px;box-shadow:var(--sombra)}
.brand .nome{font-size:20px;font-weight:800;letter-spacing:-.4px;color:var(--verde)}
.brand .igreja{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--cinza)}
.brand .by{font-size:10px;letter-spacing:1.2px;color:#9aa8a2;text-transform:uppercase}

/* Topbar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,244,238,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.topbar .inner{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.topbar .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--verde),#0a2540);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;font-size:14.5px;color:var(--verde);letter-spacing:-.2px;line-height:1.1}
.topbar .t span{font-size:9.5px;letter-spacing:1.2px;color:var(--cinza);text-transform:uppercase}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--linha);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:15px}

/* Cards e blocos */
.card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:16px;box-shadow:var(--sombra);margin-bottom:12px}
.card.tight{padding:13px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:10px}
.grid.g2{grid-template-columns:1fr 1fr}
.grid.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:520px){.grid.g3{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;background:var(--verde);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;width:100%;transition:transform .06s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--verde);border:1px solid var(--linha)}
.btn.gold{background:linear-gradient(135deg,#c9a75c,#a9863f);color:#251c08}
.btn.danger{background:#fff;color:var(--vermelho);border:1px solid #e8cfcc}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;width:auto}
.btn.xs{padding:6px 10px;font-size:12px;border-radius:9px;width:auto}
.btn.link{background:none;color:var(--cinza);font-weight:600;font-size:13px;padding:6px;width:auto;text-decoration:underline}

/* Formulário */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:#3d4a44;margin-bottom:5px;letter-spacing:.1px}
.field label .req{color:var(--vermelho)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--linha);border-radius:11px;background:#fff;color:var(--tinta);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--verde2);box-shadow:0 0 0 3px rgba(19,122,90,.12)}
.field textarea{min-height:78px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--cinza);margin-top:4px}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.field2{grid-template-columns:1fr}}

/* Etiquetas */
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--verde3);color:var(--verde);font-size:12px;font-weight:700;white-space:nowrap}
.chip.gold{background:var(--dourado2);color:#7a5c17}
.chip.gray{background:#f0eee7;color:var(--cinza)}
.chip.red{background:#fbeceb;color:var(--vermelho)}
.chip.blue{background:#e8f0f8;color:var(--azul)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.badge-verif{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:#8a6a1f;background:var(--dourado2);padding:3px 7px;border-radius:999px}
.badge-demo{font-size:10px;color:#9aa8a2;border:1px dashed var(--linha);padding:1px 6px;border-radius:6px}

/* Avatar */
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--verde3);display:grid;place-items:center;color:var(--verde);font-weight:800;flex:none;font-size:16px;border:1px solid var(--linha)}
.avatar.lg{width:74px;height:74px;font-size:24px}
.avatar.sm{width:34px;height:34px;font-size:13px}

/* Estatísticas */
.stat{background:#fff;border:1px solid var(--linha);border-radius:var(--r);padding:13px;text-align:center;box-shadow:var(--sombra)}
.stat b{display:block;font-size:25px;color:var(--verde);line-height:1.1;letter-spacing:-1px}
.stat span{font-size:11.5px;color:var(--cinza);font-weight:600}
.livedot{width:7px;height:7px;border-radius:50%;background:#22a06b;display:inline-block;margin-right:5px;box-shadow:0 0 0 3px rgba(34,160,107,.15)}

/* Lista */
.item{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:700;font-size:14.5px}
.item .sub{font-size:12.5px;color:var(--cinza)}
.empty{text-align:center;padding:28px 14px;color:var(--cinza);font-size:13.5px}
.empty .big{font-size:30px;display:block;margin-bottom:6px;opacity:.6}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{max-width:820px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:6px 4px}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 4px;font-size:10px;font-weight:700;color:#8b978f;cursor:pointer;flex:1;min-width:0}
.tabbar button .ic{font-size:18px;line-height:1;filter:grayscale(1);opacity:.6}
.tabbar button.on{color:var(--verde)}
.tabbar button.on .ic{filter:none;opacity:1}

/* Modal */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.on{display:block}
.mask{position:absolute;inset:0;background:rgba(16,26,22,.45);backdrop-filter:blur(2px)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--creme);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;max-width:820px;margin:0 auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin-bottom:12px}
.sheet .fechar{position:absolute;right:12px;top:12px;border:0;background:#fff;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px;color:var(--cinza);border:1px solid var(--linha)}

/* Toast */
#toast-root{position:fixed;left:0;right:0;bottom:86px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(22,33,29,.94);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Cartão de visita */
.pro-card{background:#fff;border:1px solid var(--linha);border-radius:var(--r);padding:14px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.pro-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--verde),var(--dourado))}
.pro-card .head{display:flex;gap:11px;align-items:flex-start}
.pro-card .nm{font-weight:800;font-size:15.5px;letter-spacing:-.2px}
.pro-card .area{font-size:12.5px;color:var(--verde);font-weight:700}
.pro-card .desc{font-size:12.5px;color:#4a5751;margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pro-card .foot{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}

/* Carteirinha */
.carteira{width:100%;max-width:430px;aspect-ratio:85/54;border-radius:14px;background:linear-gradient(140deg,#12345c,#0a2540 60%,#153f6b);color:#fff;padding:14px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(10,60,44,.28);margin:0 auto}
.carteira::after{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;border:22px solid rgba(191,155,82,.22)}
.carteira .ct{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#cbb98d}
.carteira .cn{font-size:13px;font-weight:800;letter-spacing:.3px}
.carteira .cf{display:flex;gap:10px;margin-top:8px;position:relative;z-index:2}
.carteira .cf img,.carteira .cf .ph{width:52px;height:52px;border-radius:9px;object-fit:cover;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:800}
.carteira .cp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.2px;line-height:1.25}
.carteira .cs{font-size:9px;color:#bcd3c7;margin-top:2px}
.carteira .cbot{position:absolute;left:14px;right:14px;bottom:10px;display:flex;justify-content:space-between;align-items:end;font-size:7.5px;color:#a9c3b6;letter-spacing:.6px;z-index:2}
.carteira .cbot b{color:#e5d3a6;font-size:8px;letter-spacing:1px}

/* Documentos */
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hintbox{background:var(--dourado2);border:1px solid #e6d5a9;color:#6b5316;padding:10px 12px;border-radius:11px;font-size:12.5px;line-height:1.4}
.hintbox.info{background:#eaf1f9;border-color:#cfe0f1;color:#274f77}
.hintbox.warn{background:#fdf0ee;border-color:#f0d2cd;color:#8c3a30}
.sec-title{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--cinza);margin:18px 4px 8px}
.footer-app{text-align:center;padding:26px 16px 10px;color:#9aa8a2;font-size:10.5px;letter-spacing:1px;line-height:1.7}
.footer-app b{color:var(--verde);letter-spacing:1.4px}
.tab-inline{display:flex;gap:6px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
.tab-inline::-webkit-scrollbar{display:none}
.tab-inline button{white-space:nowrap;border:1px solid var(--linha);background:#fff;color:var(--cinza);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer}
.tab-inline button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.inline-fields{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:end}
@media(max-width:560px){.inline-fields{grid-template-columns:1fr 1fr}}
hr.dash{border-top:1px dashed var(--linha);margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--linha);font-size:13px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--cinza)}
.kv span:last-child{font-weight:700;text-align:right}
.stars{color:#c9a75c;letter-spacing:1px;font-size:13px}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .avatar{width:62px;height:62px;font-size:20px}

/* ===== catálogo refinado ===== */
.hero{background:linear-gradient(160deg,#12345c,#0a2540);border-radius:18px;padding:18px 16px 16px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-46px;top:-64px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(191,155,82,.17)}
.hero h2{color:#fff;font-size:22px;margin:0 0 2px}
.hero p{color:#c9dcd3;font-size:12.5px;margin:0 0 14px}
.hero .busca{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 12px;position:relative;z-index:2}
.hero .busca input{flex:1;width:100%;background:none;border:0;color:#fff;outline:none;font-size:14px;padding:0}
.hero .busca input::placeholder{color:#b7cec4}
.cat-scroll{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-scroll button{flex:none;display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--linha);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;color:#4a5751;cursor:pointer;font-family:inherit}
.cat-scroll button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.cat-scroll button .ic{font-size:14px;line-height:1}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--linha);background:#fff;color:var(--cinza);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.filters button.on{background:var(--dourado2);border-color:#e3d3a8;color:#6b5316}
.pro-card{padding:0;overflow:hidden}
.pro-card::before{display:none}
.pc-body{padding:13px 14px 14px}
.pc-top{display:flex;gap:11px;align-items:flex-start}
.pc-name{font-weight:800;font-size:15.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pc-role{font-size:12px;color:var(--verde);font-weight:700;margin-top:1px}
.pc-meta{font-size:11.5px;color:var(--cinza);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.pc-desc{font-size:12.5px;color:#4a5751;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.pc-tags .chip{font-size:10.5px;padding:3px 8px}
.pc-actions{display:flex;gap:6px;margin-top:11px}
.pc-actions .btn{flex:1}
.btn.wapp{background:#1faa59}
.dot{width:6px;height:6px;border-radius:50%;background:#22a06b;display:inline-block;margin-right:3px}
.dot.off{background:#c7cfca}
.tabbar button{position:relative}
.tbadge{position:absolute;top:0;left:50%;transform:translateX(10px);background:var(--vermelho);color:#fff;font-size:9px;font-weight:800;min-width:15px;line-height:15px;border-radius:99px;padding:0 4px;text-align:center}
.tl{list-style:none;padding:0;margin:9px 0 0 4px;border-left:2px solid var(--linha)}
.tl li{position:relative;padding:0 0 7px 13px;font-size:11.5px;color:var(--cinza)}
.tl li::before{content:"";position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--dourado)}
.tl li:last-child{padding-bottom:0}
.tl li b{color:var(--tinta);font-weight:700}
.urgencia{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:#fdf0ee;color:#8c3a30;white-space:nowrap}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal-root"><div class="mask" onclick="App.closeModal()"></div><div class="sheet" id="sheet"></div></div>
<div id="toast-root"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
